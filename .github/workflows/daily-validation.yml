name: Validate pushed S5 products
on:
  push:
    branches: [main]
    paths: ['daily-inputs/**']
  workflow_dispatch:
    inputs:
      manifest:
        description: Repository-relative manifest path, or "all" to refresh every uploaded package
        required: false
        type: string
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      manifests: ${{ steps.changed.outputs.manifests }}
    env:
      BEFORE_SHA: ${{ github.event.before }}
      SELECTED_MANIFEST: ${{ inputs.manifest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - name: Select changed product packages
        id: changed
        run: |
          if test "$SELECTED_MANIFEST" = all; then
            git ls-files 'daily-inputs/**/manifest.json' > "$RUNNER_TEMP/changed_paths.txt"
          elif test -n "$SELECTED_MANIFEST"; then
            printf '%s\n' "$SELECTED_MANIFEST" > "$RUNNER_TEMP/changed_paths.txt"
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR "$BEFORE_SHA" "$GITHUB_SHA" -- daily-inputs > "$RUNNER_TEMP/changed_paths.txt"
          else
            git ls-files daily-inputs > "$RUNNER_TEMP/changed_paths.txt"
          fi
          python tools/list_changed_manifests.py "$RUNNER_TEMP/changed_paths.txt" >> "$GITHUB_OUTPUT"
  validate:
    needs: select
    if: needs.select.outputs.manifests != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        manifest: ${{ fromJSON(needs.select.outputs.manifests) }}
    concurrency:
      group: s5-${{ matrix.manifest }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MANIFEST: ${{ matrix.manifest }}
    steps:
      - uses: actions/checkout@v4
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install scientific dependencies
        run: python -m pip install -e '.[scientific]'
      - name: Fetch only selected product assets from Git LFS
        run: |
          git lfs version
          ROOT="${MANIFEST%/manifest.json}"
          git lfs pull --include "$ROOT/assets/*" --exclude ""
          printf '%s\n' "$MANIFEST" > "$RUNNER_TEMP/changed_paths.txt"
      - name: Install provider credentials for this run
        env:
          DOWNLOADER_ENV: ${{ secrets.S5_DOWNLOADER_ENV }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          target=Path(os.environ['RUNNER_TEMP'])/'downloaders.env'
          target.write_text(os.environ.get('DOWNLOADER_ENV',''),encoding='utf-8')
          target.chmod(0o600)
          PY
      - name: Restore pending MeteoHub request IDs
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/pending-request-state
          key: s5-request-${{ matrix.manifest }}-${{ github.run_id }}
          restore-keys: s5-request-${{ matrix.manifest }}-
      - name: Initialize request metadata directory
        run: mkdir -p "$RUNNER_TEMP/pending-request-state"
      - name: Fetch references and validate changed packages
        run: |
          ROOT="${MANIFEST%/manifest.json}"
          SAFE_NAME="${ROOT//\//-}"
          python tools/run_pushed_inputs.py --changed-paths "$RUNNER_TEMP/changed_paths.txt" \
            --downloader-credentials-file "$RUNNER_TEMP/downloaders.env" \
            --request-state-dir "$RUNNER_TEMP/pending-request-state" \
            --workdir "$RUNNER_TEMP/s5-pushed-validation" \
            --public-summary "$RUNNER_TEMP/public-kpi/$SAFE_NAME.json"
      - name: Retain aggregate KPI outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpi-${{ strategy.job-index }}
          path: ${{ runner.temp }}/public-kpi/*.json
          if-no-files-found: ignore
      - name: Retain pending request IDs only
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pending-request-state
          key: s5-request-${{ matrix.manifest }}-${{ github.run_id }}
      - name: Remove downloaded references and products from runner
        if: always()
        run: |
          test -n "$RUNNER_TEMP"
          rm -rf "$RUNNER_TEMP/s5-pushed-validation"
      - name: Remove provider credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/downloaders.env"
  publish:
    needs: [select, validate]
    if: always() && needs.select.result == 'success' && needs.validate.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: s5-public-kpi-page
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: kpi-*
          path: ${{ runner.temp }}/kpi-results
          merge-multiple: true
      - name: Update public aggregate results
        run: python tools/public_kpi_page.py docs/kpi-data.json "$RUNNER_TEMP/kpi-results"
      - name: Commit result page data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/kpi-data.json
          git diff --cached --quiet || { git commit -m 'Update public S5 KPI results'; git push origin HEAD:main; }
