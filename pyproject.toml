[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operational-validation-iride"
version = "0.1.0"
description = "Operational scientific validation of IRIDE S5-02 products"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2024.1; sys_platform == 'win32'"]

[project.optional-dependencies]
scientific = ["numpy>=1.24,<3", "rasterio>=1.3,<2", "pyproj>=3.6,<4", "shapely>=2,<3", "requests>=2.31,<3", "matplotlib>=3.8,<4"]
dev = ["openpyxl>=3.1,<4"]

[project.scripts]
iride-validate = "s5validation.cli:main"

[tool.setuptools.packages.find]
include = ["s5validation*"]
